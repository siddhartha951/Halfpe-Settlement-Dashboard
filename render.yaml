services:
  - type: web
    name: halfpe-settlement-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_STORE_URL
        value: halfpeapp.myshopify.com
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2024-01
      - key: SYNC_INTERVAL_MINUTES
        value: 5
